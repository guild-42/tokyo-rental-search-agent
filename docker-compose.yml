services:
  rental-search:
    build: .
    volumes:
      - rental-data:/app/data
    environment:
      TZ: Asia/Tokyo
      FETCH_INTERVAL_HOURS: "3"
      FETCH_MAX_PAGES: "10"
      FETCH_WARD_CODES: "13104,13113,13114"
      MAX_AGE_DAYS: "30"
      DB_PATH: "/app/data/rental.db"
    restart: unless-stopped
    networks:
      - coolify
      - default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  coolify:
    external: true

volumes:
  rental-data:
    driver: local
