services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - rental-data:/app/data
    environment:
      TZ: Asia/Tokyo
      PORT: 8080
      FETCH_INTERVAL_MINUTES: 10
      FETCH_MAX_PAGES: 10
      FETCH_WARD_CODES: 13104,13113,13114,13115
      MAX_AGE_DAYS: 30
      DB_PATH: /app/data/rental.db
      NOTIFY_ENABLED: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

volumes:
  rental-data:
    driver: local
