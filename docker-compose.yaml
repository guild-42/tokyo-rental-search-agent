# 東京賃貸サーチエージェント
#
# 本番デプロイ (guild42-vm-01 / Coolify):
#   - Coolify は Dockerfile ビルドパックでこのアプリをビルド・起動する
#     （build pack: dockerfile / port: 8080 / domain: https://7d.guild42.net）
#   - 公開経路: Cloudflare → gcp Tunnel(VM常駐) → https://localhost:443(Traefik) → app:8080
#     ※ Cloudflare Tunnel はホストの systemd cloudflared (gcp tunnel) を使う。
#       compose 内に cloudflared サイドカーは置かない（ホストトンネルと競合するため）。
#   - Traefik へのルーティングは Coolify がドメイン設定から自動生成する。
#
# ローカル開発は docker-compose.local.yaml を使用（ホスト 8080 に直接公開）。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - rental-data:/app/data
    environment:
      TZ: Asia/Tokyo
      PORT: 8080
      FETCH_INTERVAL_MINUTES: 10
      FETCH_MAX_PAGES: 10
      FETCH_WARD_CODES: 13104,13113,13114,13115
      MAX_AGE_DAYS: 30
      DB_PATH: /app/data/rental.db
      NOTIFY_ENABLED: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  rental-data:
    driver: local
